name: Publish to PyPI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "pyproject.toml"
      - "README.md"
      - "LICENSE"
    tags:
      - "v*"
  workflow_dispatch:

# One publish at a time; do not cancel an in-flight upload.
concurrency:
  group: pypi-publish-${{ github.repository }}
  cancel-in-progress: false

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read package version
        id: meta
        run: |
          VERSION=$(grep -E '^__version__ = ' src/seobuddy/__init__.py | sed -E 's/^__version__ = ["'\''](.+)["'\'']$/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      - name: Skip if version already on PyPI
        id: skip
        run: |
          if curl -fsSL "https://pypi.org/pypi/seobuddy/${{ steps.meta.outputs.version }}/json" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "seobuddy ${{ steps.meta.outputs.version }} is already on PyPI — skipping upload."
            echo "Bump __version__ in src/seobuddy/__init__.py to publish again."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Will publish seobuddy ${{ steps.meta.outputs.version }}."
          fi

      - name: Install build tools
        if: steps.skip.outputs.skip != 'true'
        run: python -m pip install --upgrade build

      - name: Build package
        if: steps.skip.outputs.skip != 'true'
        run: python -m build

      - name: Publish to PyPI
        if: steps.skip.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
